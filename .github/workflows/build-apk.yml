name: Build MSbook Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Build Web Application with 100% Full Features
        run: |
          npm install
          npm run build
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/*
          cp -rf dist/* android/app/src/main/assets/
          ls -la android/app/src/main/assets/

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify or Generate Release Keystore
        working-directory: ./android
        run: |
          if [ ! -f "release.keystore" ]; then
            echo "Generating release.keystore..."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias msbook \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass msbook123 \
              -keypass msbook123 \
              -dname "CN=MSbook, OU=Accounting, O=MSbook, L=Bangalore, ST=Karnataka, C=IN"
          else
            echo "Existing release.keystore detected."
          fi

      - name: Build Release & Debug APKs
        working-directory: ./android
        run: |
          gradle assembleRelease assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Outputs
        run: |
          mkdir -p build-artifacts
          if ls android/app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            cp android/app/build/outputs/apk/release/*.apk build-artifacts/MSbook-release.apk
            echo "Release APK copied."
          fi
          if ls android/app/build/outputs/apk/debug/*.apk 1> /dev/null 2>&1; then
            cp android/app/build/outputs/apk/debug/*.apk build-artifacts/MSbook-debug.apk
            echo "Debug APK copied."
          fi
          ls -lh build-artifacts/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSbook-release-apk
          path: build-artifacts/MSbook-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSbook-debug-apk
          path: build-artifacts/MSbook-debug.apk
          if-no-files-found: warn
          retention-days: 30
